name: CI

on:
  push:
    branches:
      - develop
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"
  pull_request:
    branches:
      - develop
      - master
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit policy
        run: npm run audit:policy

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Install Chromium for API PDF tests
        run: npm --prefix apps/api exec -- playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Generate OpenAPI snapshot
        run: npm run openapi:generate

      - name: Verify OpenAPI snapshot
        run: git diff --exit-code -- docs/openapi.json

      - name: Validate Docker Compose
        run: docker compose -f infra/docker-compose.yml config

  web-e2e-smoke:
    name: Web e2e smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npm --prefix apps/web exec -- playwright install --with-deps chromium

      - name: Run frontend security headers smoke
        run: npm --prefix apps/web run test:e2e -- landing.spec.ts --project=chromium -g "frontend security headers"
