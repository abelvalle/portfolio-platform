services:
  - type: web
    name: portfolio-platform-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-platform-db
          property: connectionString
      - key: API_CORS_ORIGIN
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: STORAGE_DIR
        value: storage
      - key: CONTACT_STORE_USER_AGENT
        value: "true"
      - key: ANALYTICS_STORE_USER_AGENT
        value: "true"
      - key: CONTACT_WEBHOOK_SECRET
        sync: false
      - key: CONTACT_WEBHOOK_RETRY_CRON_SECRET
        sync: false
      - key: CONTACT_EMAIL_API_KEY
        sync: false
      - key: MEDIA_EXTERNAL_SCAN_API_KEY
        sync: false
      - key: CV_AI_ADAPTER_API_KEY
        sync: false
      - key: LINKEDIN_CLIENT_ID
        sync: false
      - key: LINKEDIN_CLIENT_SECRET
        sync: false
      - key: LINKEDIN_REDIRECT_URI
        sync: false

databases:
  - name: portfolio-platform-db
    databaseName: portfolio_platform
    user: portfolio
